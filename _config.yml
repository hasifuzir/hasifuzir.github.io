# Site settings
title: "Hasif Uzir"
description: "Hasif Uzir's resume"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Muhammad Hasif Bin Muhammad Uzir"
resume_title:                   "Business Analyst & Product Owner  | Product Management | SaaS Innovation & Agile Delivery | PSPO I Certified | JLPT N4 Certified"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "hasifuzir@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:
resume_contact_address:

resume_header_contact_info:     "hasifuzir@gmail.com"
display_header_contact_info:    "false"

resume_header_intro: "<p>PSPO-certified Business Analyst and Product Owner with extensive experience driving SaaS product strategy, product operations, workflow optimization, and Agile transformation. I specialize in translating complex technical requirements into actionable roadmaps that align with overarching business objectives. With a proven track record of managing cross-functional, offshore engineering teams, I deliver scalable platform features that streamline operations and directly impact user satisfaction and revenue.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
resume_section_interests:       true
resume_section_links:           true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/hasifuzir"
  #resume_twitter_url:           ""
  #resume_dribbble_url:          ""
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://www.linkedin.com/in/hasifuzir"
  # resume_instagram_url:         "insert your Instagram URL here"
  resume_website_url:           "http://hasifuzir.github.io"
  #resume_medium_url:            ""
resume_print_social_links:      true

# Design settings
resume_theme:                   default

